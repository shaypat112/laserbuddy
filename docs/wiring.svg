<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1c2420">LaserBuddy wiring</text>
  <text x="30" y="64" font-size="14" fill="#5e6a64">Arduino Uno on USB to your laptop. Servos run from a separate 5 V 2 A supply. All grounds connect together.</text>

  <!-- Power supply + terminal adapter -->
  <rect x="30" y="100" width="170" height="80" rx="8" fill="#eef1ec" stroke="#1c2420" stroke-width="2"/>
  <text x="115" y="130" font-size="15" font-weight="bold" text-anchor="middle">5 V 2 A wall supply</text>
  <text x="115" y="150" font-size="12" text-anchor="middle" fill="#5e6a64">+ barrel-jack screw terminal</text>
  <text x="115" y="168" font-size="12" text-anchor="middle" fill="#5e6a64">adapter (+ and −)</text>

  <!-- Breadboard power rails -->
  <rect x="250" y="95" width="700" height="90" rx="6" fill="#f7f7f3" stroke="#9a9a96" stroke-width="2"/>
  <line x1="265" y1="120" x2="935" y2="120" stroke="#d8413a" stroke-width="5"/>
  <line x1="265" y1="160" x2="935" y2="160" stroke="#3b63c9" stroke-width="5"/>
  <text x="940" y="112" font-size="13" text-anchor="end" fill="#d8413a" font-weight="bold">+5 V rail (servo power)</text>
  <text x="940" y="178" font-size="13" text-anchor="end" fill="#3b63c9" font-weight="bold">− GND rail (shared ground)</text>
  <text x="600" y="143" font-size="12" text-anchor="middle" fill="#5e6a64">breadboard power rails</text>
  <path d="M200 125 H265" stroke="#d8413a" stroke-width="4" fill="none"/>
  <path d="M200 160 H265" stroke="#1c2420" stroke-width="4" fill="none"/>
  <text x="232" y="118" font-size="11" text-anchor="middle" fill="#d8413a">+</text>
  <text x="232" y="176" font-size="11" text-anchor="middle">−</text>

  <!-- Arduino -->
  <rect x="40" y="300" width="250" height="300" rx="10" fill="#0f7fa6" stroke="#0a5a76" stroke-width="2"/>
  <text x="165" y="335" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">Arduino Uno</text>
  <text x="165" y="355" font-size="12" fill="#d9f1f8" text-anchor="middle">USB cable to laptop</text>
  <g font-size="14" fill="#fff" font-weight="bold">
    <circle cx="290" cy="400" r="6" fill="#fff"/><text x="275" y="405" text-anchor="end">D9</text>
    <circle cx="290" cy="440" r="6" fill="#fff"/><text x="275" y="445" text-anchor="end">D10</text>
    <circle cx="290" cy="480" r="6" fill="#fff"/><text x="275" y="485" text-anchor="end">D7</text>
    <circle cx="290" cy="530" r="6" fill="#fff"/><text x="275" y="535" text-anchor="end">3.3V</text>
    <circle cx="290" cy="570" r="6" fill="#fff"/><text x="275" y="575" text-anchor="end">GND</text>
  </g>

  <!-- Pan servo -->
  <rect x="470" y="230" width="150" height="60" rx="6" fill="#2f5bd3"/>
  <text x="545" y="258" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Pan servo</text>
  <text x="545" y="277" font-size="11" fill="#dfe7ff" text-anchor="middle">(in the base)</text>
  <!-- Tilt servo -->
  <rect x="690" y="230" width="150" height="60" rx="6" fill="#2f5bd3"/>
  <text x="765" y="258" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Tilt servo</text>
  <text x="765" y="277" font-size="11" fill="#dfe7ff" text-anchor="middle">(in the wall)</text>
  <!-- servo power leads -->
  <path d="M500 230 V120" stroke="#d8413a" stroke-width="3"/><path d="M520 230 V160" stroke="#8b4513" stroke-width="3"/>
  <path d="M720 230 V120" stroke="#d8413a" stroke-width="3"/><path d="M740 230 V160" stroke="#8b4513" stroke-width="3"/>
  <circle cx="500" cy="120" r="4" fill="#1c2420"/><circle cx="520" cy="160" r="4" fill="#1c2420"/>
  <circle cx="720" cy="120" r="4" fill="#1c2420"/><circle cx="740" cy="160" r="4" fill="#1c2420"/>
  <text x="528" y="215" font-size="11" fill="#5e6a64">red → +, brown → −</text>
  <text x="748" y="215" font-size="11" fill="#5e6a64">red → +, brown → −</text>
  <!-- servo signals -->
  <path d="M296 400 H580 V290" stroke="#f28c28" stroke-width="3" fill="none"/>
  <path d="M296 440 H820 V290" stroke="#f28c28" stroke-width="3" fill="none"/>
  <text x="590" y="394" font-size="12" fill="#b35f10">orange → D9</text>
  <text x="830" y="434" font-size="12" fill="#b35f10">orange → D10</text>

  <!-- Laser switch: D7 -> 1k -> transistor base -->
  <rect x="330" y="470" width="70" height="22" rx="4" fill="#e6d2a8" stroke="#8a7650"/>
  <text x="365" y="486" font-size="12" text-anchor="middle">1 kΩ</text>
  <path d="M296 480 H330" stroke="#1c2420" stroke-width="3"/>
  <path d="M400 481 H450" stroke="#1c2420" stroke-width="3"/>
  <rect x="450" y="458" width="110" height="46" rx="6" fill="#222"/>
  <text x="505" y="480" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">PN2222</text>
  <text x="505" y="496" font-size="10" fill="#ccc" text-anchor="middle">transistor</text>
  <text x="440" y="474" font-size="12" font-weight="bold" text-anchor="end">B</text>
  <text x="568" y="470" font-size="12" font-weight="bold">C</text>
  <text x="568" y="512" font-size="12" font-weight="bold">E</text>
  <text x="505" y="526" font-size="11" fill="#5e6a64" text-anchor="middle">flat face toward you,</text>
  <text x="505" y="540" font-size="11" fill="#5e6a64" text-anchor="middle">legs left to right: E  B  C</text>
  <!-- collector -> laser (-) -->
  <path d="M560 474 H700" stroke="#1c2420" stroke-width="3"/>
  <!-- emitter -> ground -->
  <path d="M560 496 H600 V570" stroke="#1c2420" stroke-width="3" fill="none"/>
  <circle cx="600" cy="570" r="4" fill="#1c2420"/>
  <!-- laser -->
  <rect x="700" y="460" width="100" height="50" rx="6" fill="#c9a24a"/>
  <text x="750" y="482" font-size="14" font-weight="bold" text-anchor="middle">Laser</text>
  <text x="750" y="499" font-size="11" text-anchor="middle">1 mW, 3 V</text>
  <text x="690" y="468" font-size="11" text-anchor="end">black (−)</text>
  <path d="M296 530 H760 V510" stroke="#d8413a" stroke-width="3" fill="none"/>
  <text x="770" y="526" font-size="11" fill="#d8413a">red (+)</text>
  <text x="330" y="524" font-size="11" fill="#d8413a">3.3V → laser red (+)</text>
  <!-- ground bus -->
  <path d="M296 570 H960 V160 H935" stroke="#3b63c9" stroke-width="3" fill="none"/>
  <text x="330" y="592" font-size="12" fill="#3b63c9" font-weight="bold">GND → − rail (the transistor E joins here too)</text>
  <text x="30" y="640" font-size="12" fill="#5e6a64">Never connect the 5 V supply (+) to the Arduino's 5V pin. Only the grounds are shared.</text>
</svg>
